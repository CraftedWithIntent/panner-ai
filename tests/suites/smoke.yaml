name: Smoke Test Suite
description: Fast baseline tests for CI/CD validation
agent_url: http://localhost:8000

test_cases:
  - name: health_check
    payload:
      test: "health_check"
    assertions:
      - type: status_code
        expected: 200
      - type: latency
        expected: null
        tolerance: 500

  - name: root_endpoint
    payload:
      test: "root_endpoint"
    assertions:
      - type: status_code
        expected: 200
