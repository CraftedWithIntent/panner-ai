name: Regression Test Suite
description: Comprehensive regression tests with baseline tracking
agent_url: http://localhost:8000

test_cases:
  - name: health_endpoint
    payload:
      test: "health"
    assertions:
      - type: status_code
        expected: 200
      - type: latency
        expected: null
        tolerance: 500

  - name: list_items_empty
    payload:
      test: "list_empty"
    assertions:
      - type: status_code
        expected: 200

  - name: create_item
    payload:
      test: "create"
      name: "Test Item"
      description: "Created by regression test"
    assertions:
      - type: status_code
        expected: 201

  - name: list_items_populated
    payload:
      test: "list_populated"
    assertions:
      - type: status_code
        expected: 200

  - name: get_item
    payload:
      test: "get"
      item_id: "1"
    assertions:
      - type: status_code
        expected: 200
      - type: latency
        expected: null
        tolerance: 300

  - name: update_item
    payload:
      test: "update"
      item_id: "1"
      name: "Updated Item"
    assertions:
      - type: status_code
        expected: 200

  - name: delete_item
    payload:
      test: "delete"
      item_id: "1"
    assertions:
      - type: status_code
        expected: 204

  - name: not_found
    payload:
      test: "not_found"
      item_id: "999"
    assertions:
      - type: status_code
        expected: 404
