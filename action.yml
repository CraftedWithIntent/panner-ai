name: Panner-AI
description: Precision testing for AI agents
author: CraftedWithIntent
branding:
  icon: check-square
  color: green

inputs:
  config:
    description: Path to test suite YAML file
    required: false
    default: suite.yaml

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - run: pip install panner-ai
      shell: bash
    - run: panner-ai run -c "${{ inputs.config }}"
      shell: bash
