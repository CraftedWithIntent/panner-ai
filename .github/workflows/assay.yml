name: Assay Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run smoke tests
        run: |
          mkdir -p reports
          assay run tests/suites/smoke.yaml --reporter json --output reports/smoke.json

  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run regression tests
        run: |
          mkdir -p reports
          assay run tests/suites/regression.yaml --reporter junit --output reports/regression.xml --reporter json --output reports/regression.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assay-reports
          path: reports/
          retention-days: 90

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Assay Regression Tests
          path: reports/regression.xml
          reporter: java-junit
          fail-on-error: true
