[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panner-ai"
version = "0.1.3"
description = "Precision testing tool for AI agents with baseline tracking and LLM evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CraftedWithIntent", email = "team@craftedwithintent.com"}]
keywords = [
    "testing",
    "ai-agents",
    "baseline-tracking",
    "llm-evaluation",
    "http-testing",
    "regression-detection",
    "ci-cd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx[http2]>=0.24.0",
    "litellm>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CraftedWithIntent/panner-ai"
Repository = "https://github.com/CraftedWithIntent/panner-ai.git"
Documentation = "https://github.com/CraftedWithIntent/panner-ai/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/CraftedWithIntent/panner-ai/issues"
Changelog = "https://github.com/CraftedWithIntent/panner-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
panner-ai = "panner_ai.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["UP017", "BLE001"]  # UP017: datetime.UTC 3.13+; BLE001: Phase 1 error propagation via exit codes

[tool.hatch.build.targets.wheel]
packages = ["src/panner_ai"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
