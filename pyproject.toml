[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay-cli"
version = "0.1.0"
description = "Precision testing tool for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CraftedWithIntent", email = "team@craftedwithintent.com"}]
keywords = ["ai", "testing", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx[http2]>=0.24.0",
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.320",
]

[project.scripts]
assay = "assay.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["UP017"]  # datetime.UTC only in 3.13+; project requires 3.11+

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
